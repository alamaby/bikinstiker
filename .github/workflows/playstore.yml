name: Build Play Store AAB

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version name (e.g. 0.27.0). Defaults to pubspec.yaml version."
        required: false
        type: string
      build_number:
        description: "Version code (integer). Defaults to pubspec.yaml build number."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve build name & number
        id: version
        run: |
          PUBSPEC_VERSION="$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')"
          PUBSPEC_NAME="${PUBSPEC_VERSION%%+*}"
          PUBSPEC_NUMBER="${PUBSPEC_VERSION##*+}"
          BUILD_NAME="${{ inputs.build_name }}"
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NAME" ]; then
            BUILD_NAME="$PUBSPEC_NAME"
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="$PUBSPEC_NUMBER"
          fi
          echo "build_name=${BUILD_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write android/key.properties
        env:
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Write .env from secrets
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_HOME_ANDROID: ${{ vars.ADMOB_BANNER_HOME_ANDROID }}
          ADMOB_BANNER_HOME_IOS: ${{ vars.ADMOB_BANNER_HOME_IOS }}
          ADMOB_BANNER_HISTORY_ANDROID: ${{ vars.ADMOB_BANNER_HISTORY_ANDROID }}
          ADMOB_BANNER_HISTORY_IOS: ${{ vars.ADMOB_BANNER_HISTORY_IOS }}
          ADMOB_BANNER_MISSIONS_ANDROID: ${{ vars.ADMOB_BANNER_MISSIONS_ANDROID }}
          ADMOB_BANNER_MISSIONS_IOS: ${{ vars.ADMOB_BANNER_MISSIONS_IOS }}
          ADMOB_BANNER_PROFILE_ANDROID: ${{ vars.ADMOB_BANNER_PROFILE_ANDROID }}
          ADMOB_BANNER_PROFILE_IOS: ${{ vars.ADMOB_BANNER_PROFILE_IOS }}
          ADMOB_BANNER_PACKS_ANDROID: ${{ vars.ADMOB_BANNER_PACKS_ANDROID }}
          ADMOB_BANNER_PACKS_IOS: ${{ vars.ADMOB_BANNER_PACKS_IOS }}
          ADMOB_REWARDED_ANDROID: ${{ vars.ADMOB_REWARDED_ANDROID }}
          ADMOB_REWARDED_IOS: ${{ vars.ADMOB_REWARDED_IOS }}
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-$SUPABASE_ANON_KEY}"
            echo "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}"
            echo "ADMOB_APP_ID=${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
            echo "ADMOB_BANNER_HOME_ANDROID=${ADMOB_BANNER_HOME_ANDROID}"
            echo "ADMOB_BANNER_HOME_IOS=${ADMOB_BANNER_HOME_IOS}"
            echo "ADMOB_BANNER_HISTORY_ANDROID=${ADMOB_BANNER_HISTORY_ANDROID}"
            echo "ADMOB_BANNER_HISTORY_IOS=${ADMOB_BANNER_HISTORY_IOS}"
            echo "ADMOB_BANNER_MISSIONS_ANDROID=${ADMOB_BANNER_MISSIONS_ANDROID}"
            echo "ADMOB_BANNER_MISSIONS_IOS=${ADMOB_BANNER_MISSIONS_IOS}"
            echo "ADMOB_BANNER_PROFILE_ANDROID=${ADMOB_BANNER_PROFILE_ANDROID}"
            echo "ADMOB_BANNER_PROFILE_IOS=${ADMOB_BANNER_PROFILE_IOS}"
            echo "ADMOB_BANNER_PACKS_ANDROID=${ADMOB_BANNER_PACKS_ANDROID}"
            echo "ADMOB_BANNER_PACKS_IOS=${ADMOB_BANNER_PACKS_IOS}"
            echo "ADMOB_REWARDED_ANDROID=${ADMOB_REWARDED_ANDROID}"
            echo "ADMOB_REWARDED_IOS=${ADMOB_REWARDED_IOS}"
          } > .env

      - name: Validate required app env
        run: |
          missing=()
          for key in SUPABASE_URL GOOGLE_WEB_CLIENT_ID; do
            if ! grep -Eq "^${key}=.+" .env; then
              missing+=("$key")
            fi
          done
          if ! grep -Eq "^SUPABASE_PUBLISHABLE_KEY=.+" .env; then
            missing+=("SUPABASE_PUBLISHABLE_KEY (or SUPABASE_ANON_KEY)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required app env vars: ${missing[*]}. Add them in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release App Bundle
        run: |
          ARGS=(--release --build-number="${{ steps.version.outputs.build_number }}")
          if [ -n "${{ steps.version.outputs.build_name }}" ]; then
            ARGS+=(--build-name="${{ steps.version.outputs.build_name }}")
          fi
          flutter build appbundle "${ARGS[@]}"

      - name: Verify signing (must NOT be debug key)
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/jarsigner.log
          if grep -qi "Android Debug" /tmp/jarsigner.log; then
            echo "::error::AAB is signed with debug key — check KEYSTORE_BASE64 / key.properties wiring."
            exit 1
          fi

      - name: Rename AAB
        id: rename
        run: |
          mkdir -p dist
          NAME="bikinstiker-${{ steps.version.outputs.build_name }}-${{ steps.version.outputs.build_number }}.aab"
          cp build/app/outputs/bundle/release/app-release.aab "dist/${NAME}"
          echo "aab_name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.aab_name }}
          path: dist/${{ steps.rename.outputs.aab_name }}
          retention-days: 30
          if-no-files-found: error

      # When the Play Console service account is ready, add a step here using
      # r0adkll/upload-google-play@v1 with serviceAccountJsonPlainText, packageName
      # (com.alamaby.bikin_stiker), releaseFiles, and track: internal. Until then,
      # download the artifact above and upload to Play Console manually.
